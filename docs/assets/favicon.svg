<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Volta, the Battery Core study coach">
  <title>Volta</title>
  <!-- Volta at tab size. This is a separate drawing from the mascot in
       `study-coach.js`, not a shrunken copy of it: at 16px the headset, the
       freckles, the shine and the eye whites collapse into mud. What survives
       is a yellow body, two dark eyes and a smile on the course blue, so that
       is all this draws — with heavier strokes than the large version, because
       hairlines disappear first. -->
  <rect width="64" height="64" rx="12" fill="#2459a8"/>
  <path d="M33 14c-1-3-2-5-3-6" fill="none" stroke="#ffd94a" stroke-width="3.5" stroke-linecap="round"/>
  <ellipse cx="32" cy="36" rx="23" ry="22" fill="#ffd94a" stroke="#c9a12c" stroke-width="2.5"/>
  <ellipse cx="24" cy="33" rx="4" ry="5" fill="#202938"/>
  <ellipse cx="40" cy="33" rx="4" ry="5" fill="#202938"/>
  <path d="M23 44q9 8 18 0" fill="none" stroke="#202938" stroke-width="4" stroke-linecap="round"/>
</svg>
