<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Volta, the Battery Core study coach">
  <title>Volta</title>
  <!-- Volta at tab size. This is a separate drawing from the mascot in
       `study-coach.js`, not a shrunken copy of it: at 16px the headset, the
       freckles, the shine and the eye whites collapse into mud. What survives
       is a yellow body, a green leaf, two dark eyes and a smile, so that is
       all this draws — with heavier strokes than the large version, because
       hairlines disappear first. -->
  <rect width="64" height="64" rx="14" fill="#07131d"/>
  <path d="M31 12C18 6 9 8 6 12c0 8 6 15 14 16 5 1 9-1 11-4z" fill="#4fbf7c" stroke="#2f8f56" stroke-width="2.5" stroke-linejoin="round"/>
  <path d="M33 13c-1-3-2-4-3-5" fill="none" stroke="#2f8f56" stroke-width="3.5" stroke-linecap="round"/>
  <ellipse cx="34" cy="37" rx="22" ry="21" fill="#ffd94a" stroke="#c9a12c" stroke-width="2.5"/>
  <ellipse cx="26" cy="34" rx="4" ry="5" fill="#1d3a2c"/>
  <ellipse cx="42" cy="34" rx="4" ry="5" fill="#1d3a2c"/>
  <path d="M25 45q9 8 18 0" fill="none" stroke="#1d3a2c" stroke-width="4" stroke-linecap="round"/>
</svg>
