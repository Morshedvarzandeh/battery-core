<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>All six mechanisms at once — Battery aging panel</title>
<link rel="stylesheet" href="panels.css">
</head>
<body>
<script src="panels.js"></script>
<div class="w">
  <div class="w-head">
    <h2>The whole cell, all six mechanisms at once</h2><span class="spacer"></span>
    <div class="controls">
      <span class="ctl"><label for="T">Temperature</label>
        <input class="range" type="range" id="T" min="-10" max="60" step="1" value="25"><output id="oT">25 °C</output></span>
      <span class="ctl"><label for="Y">Years</label>
        <input class="range" type="range" id="Y" min="1" max="120" step="1" value="50"><output id="oY">5.0</output></span>
    </div>
  </div>
  <div class="segmented" id="duty" role="group" aria-label="Duty scenario" style="align-self:flex-start">
    <button type="button" data-v="storage" aria-pressed="true">Shelf storage</button>
    <button type="button" data-v="hot" aria-pressed="false">Hot</button>
    <button type="button" data-v="cold" aria-pressed="false">Cold / fast charge</button>
    <button type="button" data-v="cycling" aria-pressed="false">Deep cycling</button>
    <button type="button" data-v="overcharge" aria-pressed="false">Overcharge</button>
  </div>
  <div class="readouts">
    <div class="ro"><b id="r1">—</b><span>usable capacity</span></div>
    <div class="ro"><b id="r2">—</b><span>internal impedance</span></div>
    <div class="ro"><b id="r3">—</b><span>self-discharge</span></div>
    <div class="ro"><b id="r4">—</b><span>time to 80 %</span></div>
  </div>
  <div class="w-body split">
    <div class="pane"><span class="pane-title">Capacity and impedance over time</span>
      <div class="figwrap" id="chart"></div><div class="legend" id="lg"></div></div>
    <div class="pane"><span class="pane-title">Which mechanism is responsible</span>
      <div class="figwrap" style="align-items:flex-start"><div class="stack" style="width:100%; gap: var(--space-4)">
        <div class="stackrow"><span>capacity fade</span><span class="stackbar" id="b-cap"></span></div>
        <div class="stackrow"><span>impedance rise</span><span class="stackbar" id="b-imp"></span></div>
        <div class="legend" id="lg2"></div>
        <p class="note" id="note"></p>
      </div></div></div>
  </div>
</div>
<script>
let duty = "storage";
function render() {
  const T = +$("#T").value, y = +$("#Y").value / 10, d = DUTY[duty];
  $("#oT").textContent = minus(T) + " °C"; $("#oY").textContent = fix(y);
  const s = severities(T, y, d), e = effects(s), eol = yearsTo80(T, d);
  const mild = Math.abs(T - 25) < 0.5;

  const P = plot(430, 230, { t: 14, r: 40, b: 36, l: 36 }, [0, 12], [0, 1]);
  const yc = v => P.m.t + 96 - 96 * (v - 0.4) / 0.6;
  const yi = v => P.m.t + 180 - 60 * (v - 1) / 4;
  let g = "";
  [1, 0.8, 0.6, 0.4].forEach(v => {
    g += `<line class="gridline" x1="${P.m.l}" x2="${P.w - P.m.r}" y1="${yc(v).toFixed(1)}" y2="${yc(v).toFixed(1)}"/>`;
    g += `<text class="axis-label" x="${P.m.l - 6}" y="${(yc(v) + 3.5).toFixed(1)}" text-anchor="end">${(100 * v).toFixed(0)}</text>`;
  });
  g += `<line class="threshold" x1="${P.m.l}" x2="${P.w - P.m.r}" y1="${yc(0.8).toFixed(1)}" y2="${yc(0.8).toFixed(1)}"/>`;
  [1, 3, 5].forEach(v => {
    g += `<line class="gridline" x1="${P.m.l}" x2="${P.w - P.m.r}" y1="${yi(v).toFixed(1)}" y2="${yi(v).toFixed(1)}"/>`;
    g += `<text class="axis-label" x="${P.m.l - 6}" y="${(yi(v) + 3.5).toFixed(1)}" text-anchor="end">×${v}</text>`;
  });
  const xs = series(61, u => u * 12);
  const cap = xs.map(t => effects(severities(T, t, d)).capacity);
  const ref = xs.map(t => effects(severities(25, t, d)).capacity);
  const imp = xs.map(t => Math.min(5, effects(severities(T, t, d)).impedance));
  const P2 = { x: P.x, y: yc }, P3 = { x: P.x, y: yi };
  if (!mild) g += `<path class="series dim" d="${pathOf(P2, xs, ref)}"/>`;
  g += `<path class="series s-cap" d="${pathOf(P2, xs, cap)}"/>`;
  g += `<path class="series s-imp" d="${pathOf(P3, xs, imp)}"/>`;
  g += `<line class="now-line" x1="${P.x(y).toFixed(1)}" x2="${P.x(y).toFixed(1)}" y1="${P.m.t}" y2="${P.m.t + 180}"/>`;
  g += `<text class="axis-label" x="${P.m.l}" y="${P.m.t - 2}">capacity, %</text>`;
  g += `<text class="axis-label" x="${P.m.l}" y="${P.m.t + 118}">impedance, × new</text>`;
  [0, 3, 6, 9, 12].forEach(t => g += `<text class="axis-label" x="${P.x(t).toFixed(1)}" y="${P.m.t + 200}" text-anchor="middle">${t}</text>`);
  g += `<text class="axis-title" x="${P.m.l + P.iw / 2}" y="${P.m.t + 214}" text-anchor="middle">years in service</text>`;
  $("#chart").innerHTML = `<svg class="fig" viewBox="0 0 ${P.w} ${P.h}" role="img"
    aria-label="Capacity falling to ${(100 * e.capacity).toFixed(0)} percent and impedance rising to ${e.impedance.toFixed(1)} times its original value over twelve years.">${g}</svg>`;
  $("#lg").innerHTML = legend([{ c: "var(--mech-sei)", label: "capacity" }, { c: "var(--mech-corrosion)", label: "impedance" }]
    .concat(mild ? [] : [{ c: "var(--ink-muted)", label: "same duty at 25 °C" }]));

  const bar = (host, w) => {
    const tot = Object.keys(w).reduce((a, k) => a + w[k] * s[k], 0) || 1;
    $(host).innerHTML = ORDER.filter(k => w[k]).map(k => {
      const p = 100 * w[k] * s[k] / tot;
      return p < 0.4 ? "" : `<i style="--c: var(--mech-${k}); width: ${p.toFixed(1)}%" title="${MECH[k].title}: ${p.toFixed(0)} %"></i>`;
    }).join("");
  };
  bar("#b-cap", CAP_W); bar("#b-imp", IMP_W);
  $("#lg2").innerHTML = legend(ORDER.map(k => ({ c: `var(--mech-${k})`, label: MECH[k].title.split(" —")[0].toLowerCase() })));

  const worst = ORDER.reduce((a, k) => (CAP_W[k] || 0) * s[k] > (CAP_W[a] || 0) * s[a] ? k : a, "sei");
  $("#note").innerHTML = `<em>${DUTY[duty].label}.</em> ${DUTY[duty].note} After ${fix(y)} years the largest single contributor to capacity fade is <em>${MECH[worst].title.split(" —")[0].toLowerCase()}</em>.`;

  $("#r1").textContent = (100 * e.capacity).toFixed(1) + " %";
  $("#r2").textContent = "×" + e.impedance.toFixed(2);
  $("#r3").textContent = e.selfDisch.toFixed(1) + " %/mo";
  $("#r4").textContent = eol ? eol.toFixed(1) + " yr" : "> 30 yr";
}
segmented("#duty", v => { duty = v; $("#T").value = DUTY[v].temp; render(); });
bind(["T", "Y"], render); render();
requestAnimationFrame(fit);
</script>

</body>
</html>
