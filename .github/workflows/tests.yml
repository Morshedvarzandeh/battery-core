name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install project and test dependencies
        run: python -m pip install -e '.[test]'
      - name: Run tests
        run: pytest

  notebook:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install project and notebook dependencies
        run: python -m pip install -e '.[notebook]'
      - name: Execute capacity and C-rate notebook
        run: >-
          jupyter nbconvert
          --to notebook
          --execute notebooks/fundamentals/02_capacity_and_c_rate.ipynb
          --output 02_capacity_and_c_rate.executed.ipynb
          --output-dir /tmp
          --ExecutePreprocessor.timeout=120
      - name: Execute Fick's first-law notebook
        run: >-
          jupyter nbconvert
          --to notebook
          --execute notebooks/transport/ficks_first_law.ipynb
          --output ficks_first_law.executed.ipynb
          --output-dir /tmp
          --ExecutePreprocessor.timeout=120
