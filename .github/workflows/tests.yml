name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  generate-battery-materials-lab:
    if: github.event_name == 'pull_request' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/battery-materials-lab
      - name: Generate Battery Materials Lab page
        run: |
          mkdir -p docs/labs/battery-materials-lab
          cat .github/bml-payload/part-*.txt \
            | base64 --decode \
            | gzip --decompress \
            > docs/labs/battery-materials-lab/index.html
          test -s docs/labs/battery-materials-lab/index.html
          grep -q "Battery Materials Lab" docs/labs/battery-materials-lab/index.html
          grep -q 'let negativeId = "zn"' docs/labs/battery-materials-lab/index.html
          grep -q 'let positiveId = "cu"' docs/labs/battery-materials-lab/index.html
          ! grep -q "unpkg.com" docs/labs/battery-materials-lab/index.html
      - name: Commit generated page
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/labs/battery-materials-lab/index.html
          git diff --cached --quiet && exit 0
          git commit -m "Add revised Battery Materials Lab [skip ci]"
          git push origin HEAD:feature/battery-materials-lab

  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install project and test dependencies
        run: python -m pip install -e '.[test]'
      - name: Run tests
        run: pytest

  notebook:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install project and notebook dependencies
        run: python -m pip install -e '.[notebook]'
      - name: Execute capacity and C-rate notebook
        run: >-
          jupyter nbconvert
          --to notebook
          --execute notebooks/fundamentals/02_capacity_and_c_rate.ipynb
          --output 02_capacity_and_c_rate.executed.ipynb
          --output-dir /tmp
          --ExecutePreprocessor.timeout=120
      - name: Execute Fick's first-law notebook
        run: >-
          jupyter nbconvert
          --to notebook
          --execute notebooks/transport/ficks_first_law.ipynb
          --output ficks_first_law.executed.ipynb
          --output-dir /tmp
          --ExecutePreprocessor.timeout=120
