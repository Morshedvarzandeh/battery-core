name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  generate-battery-materials-lab:
    if: github.event_name == 'pull_request' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/battery-materials-lab
      - name: Generate Battery Materials Lab page
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64
          import gzip
          import hashlib
          import traceback

          debug = Path('.github/bml-debug.txt')
          parts = sorted(Path('.github/bml-payload').glob('part-*.txt'))
          details = '\n'.join(
              f'{path.name}: {len(path.read_bytes())} bytes, sha256={hashlib.sha256(path.read_bytes()).hexdigest()}'
              for path in parts
          )
          payload = ''.join(path.read_text(encoding='utf-8').strip() for path in parts)
          compressed = b''
          try:
              compressed = base64.b64decode(payload, validate=True)
              html = gzip.decompress(compressed)
              text = html.decode('utf-8')

              checks = {
                  'part count': len(parts) == 6,
                  'Battery Materials Lab': 'Battery Materials Lab' in text,
                  'Zn default': 'let negativeId = "zn"' in text,
                  'Cu default': 'let positiveId = "cu"' in text,
                  'no unpkg': 'unpkg.com' not in text,
              }
              failed = [name for name, passed in checks.items() if not passed]
              if failed:
                  raise AssertionError('failed checks: ' + ', '.join(failed))

              output = Path('docs/labs/battery-materials-lab/index.html')
              output.parent.mkdir(parents=True, exist_ok=True)
              output.write_bytes(html)
              debug.write_text(
                  f'success\n{details}\npayload={len(payload)}\n'
                  f'compressed={len(compressed)}\nhtml={len(html)}\n'
                  f'sha256={hashlib.sha256(html).hexdigest()}\n',
                  encoding='utf-8',
              )
          except Exception:
              debug.write_text(
                  f'failure\n{details}\npayload={len(payload)}\ncompressed={len(compressed)}\n'
                  + traceback.format_exc(),
                  encoding='utf-8',
              )
          PY
      - name: Commit generated page or diagnostics
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/bml-debug.txt
          if [ -f docs/labs/battery-materials-lab/index.html ]; then
            git add docs/labs/battery-materials-lab/index.html
          fi
          git diff --cached --quiet && exit 0
          git commit -m "Reconstruct Battery Materials Lab [skip ci]"
          git push origin HEAD:feature/battery-materials-lab

  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install project and test dependencies
        run: python -m pip install -e '.[test]'
      - name: Run tests
        run: pytest

  notebook:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install project and notebook dependencies
        run: python -m pip install -e '.[notebook]'
      - name: Execute capacity and C-rate notebook
        run: >-
          jupyter nbconvert
          --to notebook
          --execute notebooks/fundamentals/02_capacity_and_c_rate.ipynb
          --output 02_capacity_and_c_rate.executed.ipynb
          --output-dir /tmp
          --ExecutePreprocessor.timeout=120
      - name: Execute Fick's first-law notebook
        run: >-
          jupyter nbconvert
          --to notebook
          --execute notebooks/transport/ficks_first_law.ipynb
          --output ficks_first_law.executed.ipynb
          --output-dir /tmp
          --ExecutePreprocessor.timeout=120
