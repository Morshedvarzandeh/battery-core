name: Generate Battery Materials Lab

on:
  push:
    branches:
      - feature/battery-materials-lab
    paths:
      - ".github/bml-payload/**"
      - ".github/workflows/generate-battery-materials-lab.yml"

permissions:
  contents: write

jobs:
  generate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/battery-materials-lab
      - name: Generate HTML
        run: |
          mkdir -p docs/labs/battery-materials-lab
          cat .github/bml-payload/part-*.txt \
            | base64 --decode \
            | gzip --decompress \
            > docs/labs/battery-materials-lab/index.html
          test -s docs/labs/battery-materials-lab/index.html
          grep -q "Battery Materials Lab" docs/labs/battery-materials-lab/index.html
          grep -q 'let negativeId = "zn"' docs/labs/battery-materials-lab/index.html
          grep -q 'let positiveId = "cu"' docs/labs/battery-materials-lab/index.html
          ! grep -q "unpkg.com" docs/labs/battery-materials-lab/index.html
      - name: Commit generated page
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/labs/battery-materials-lab/index.html
          git diff --cached --quiet && exit 0
          git commit -m "Add revised Battery Materials Lab [skip ci]"
          git push origin HEAD:feature/battery-materials-lab
