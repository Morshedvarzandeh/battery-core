[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "battery-core"
version = "0.2.0"
description = "Small, well-documented building blocks for battery physics models"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Morshed Varzandeh" }]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Physics",
]
dependencies = ["numpy>=1.23"]

[project.optional-dependencies]
test = ["pytest>=7", "tomli>=2; python_version < '3.11'"]
lint = ["mypy>=1.11", "ruff>=0.6"]
notebook = [
    "jupyterlab>=4.2,<5",
    "matplotlib>=3.8,<4",
    "nbconvert>=7.16,<8",
]

[project.urls]
Documentation = "https://github.com/Morshedvarzandeh/battery-core/tree/main/docs"
Repository = "https://github.com/Morshedvarzandeh/battery-core"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
# Teaching notebooks use the symbols of the physics they explain: `T_C` for a
# Celsius temperature and `Ea` for an activation energy read correctly to a
# battery engineer, and degree, approximation, and multiplication signs belong
# in the prose. Prose line length is not enforced in narrative cells.
"notebooks/**/*.ipynb" = ["E501", "N803", "N806", "RUF001", "RUF002", "RUF003"]

[tool.mypy]
python_version = "3.10"
files = ["src"]
strict = true
